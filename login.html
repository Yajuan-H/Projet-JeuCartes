<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="JS/login.js" defer></script>
</head>
<body>
    <h1>ENI - Memory - Connecter</h1>

    <form>
      
        <div class="login">
          <label for="email"><b>Email</b></label>
          <input type="email" id="email" placeholder="Entrer votre email" name="email" required>
          <br>
        <br>
      
          <label for="mdp"><b>Password</b></label>
          <input type="password" id="mdp" placeholder="Mot de passe" name="mdp" required>
          <br>
        <br>
      
          <button type="submit">Login</button>
          <button type="button" class="cancelbtn">Cancel</button>
          <br><br>
          <span class="psw"><a href="#">Forgot password?</a></span>
        </div>
  
    </form>
    <br>
    <br>
      
</body>
</html>
